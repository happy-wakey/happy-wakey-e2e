name: e2e-contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happy-wakey-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Verify Zed package contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output /tmp/zed.tar.gz \
            https://github.com/zed-pkg/zed-cli/releases/download/v0.2.3/zed-x86_64-unknown-linux-gnu.tar.gz
          echo 'b8f81a8e4943cbaeb47153386819a911dcf02666a8709c5bd013e4f35b1ba1b9  /tmp/zed.tar.gz' | sha256sum --check
          tar -xzf /tmp/zed.tar.gz -C /tmp
          /tmp/zed validate --require-lock
      - run: npm ci --ignore-scripts
      - run: npm test
